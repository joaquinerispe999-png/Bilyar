<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Login - Bilyaran ni Joaqs</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="assets/css/interface_style.css">
</head>

<body>

    <!-- Background Image -->
    <img src="assets/src/Bilyar_BG.png" alt="Background" class="bg-image">

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Transparent Navbar -->
    <nav class="navbar">

        <div class="logo">
            <i class="fas fa-cue"></i>
            BilliardPro
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="sign_up.html">Sign Up</a></li>
        </ul>

    </nav>

    <!-- Main Container -->
    <div class="container">

        <!-- Glass Card -->
        <div class="glass-card login-card">

            <div class="login-icon">
                <i class="fas fa-user-lock"></i>
            </div>

            <h1>Sign In</h1>

            <p class="subtitle">
                Enter your credentials to continue
            </p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Username -->
                <div class="input-group">

                    <label>
                        <i class="fas fa-user"></i>
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="loginIdentifier"
                        placeholder="Enter username or email"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="input-group">

                    <label>
                        <i class="fas fa-lock"></i>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <!-- Options -->
                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox" id="rememberMe">

                        Remember me

                    </label>

                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="btn login-btn">
                    <i class="fas fa-right-to-bracket"></i>
                    Sign In
                </button>

                <!-- Signup Redirect -->
                <div class="signup-section">

                    <p>Don't have an account yet?</p>

                    <a href="sign_up.html" class="btn signup-btn">
                        Create Account
                    </a>

                </div>

                <!-- Message -->
                <div id="loginMessage"></div>

            </form>

        </div>

    </div>

    <!-- JS -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const msg = document.getElementById('loginMessage');

        loginForm.addEventListener('submit', function(e) {

            e.preventDefault();

            const id = document.getElementById('loginIdentifier').value.trim();
            const pw = document.getElementById('loginPassword').value.trim();

            if (!id || !pw) return;

            msg.innerHTML = `
                <div class="success-message">
                    Signed in successfully (demo)
                </div>
            `;

            // Example redirect:
            // window.location.href = "dashboard.html";

        });
    </script>

</body>
</html>
